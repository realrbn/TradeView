plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

group = 'de.tradeview'
version = "${mod_version}-1.21.1-forge"
base { archivesName = 'tradeview' }

def repositoryRoot = file('../..')
sourceSets.main {
    // Loader-independent 1.21.1 code is shared with the Fabric and NeoForge builds.
    java.srcDir "${repositoryRoot}/src/common-1.21.1/java"
    java.srcDir "${repositoryRoot}/src/forge-1.21.1/java"
    resources.srcDir "${repositoryRoot}/src/common/resources"
    resources.srcDir "${repositoryRoot}/src/common-1.21.1/resources"
    resources.srcDir "${repositoryRoot}/src/forge-1.21.1/resources"
}

minecraft {
    mappings channel: 'official', version: '1.21.1'
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            args '--mixin.config=tradeview-legacy.mixins.json'
        }
        register('client')
        register('server') { args '--nogui' }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

// Forge does not ship MixinExtras; it is nested as a Jar-in-Jar mod, as FML resolves it from META-INF/jarjar.
configurations { bundled { transitive = false } }

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:1.21.1-${forge_version}")
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    runtimeOnly "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"
    bundled "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"
}

def jarJarMetadata = tasks.register('jarJarMetadata') {
    def output = layout.buildDirectory.file('nestedJars/META-INF/jarjar/metadata.json')
    inputs.property 'version', mixinextras_version
    outputs.file output
    doLast {
        def jar = configurations.bundled.singleFile.name
        output.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([jars: [[
            identifier: [group: 'io.github.llamalad7', artifact: 'mixinextras-forge'],
            version: [range: "[${mixinextras_version},)", artifactVersion: mixinextras_version],
            path: "META-INF/jarjar/${jar}", isObfuscated: false]]]))
    }
}

// Scripted client run (real world, villager and trade screen): gradlew runClient -PtradeviewValidation
// The fixture is its own mod jar in a separate game directory, so it never reaches the distributable JAR.
sourceSets.create('validation') {
    java.srcDir "${repositoryRoot}/src/validation-forge-1.21.1/java"
    resources.srcDir "${repositoryRoot}/src/validation-forge-1.21.1/resources"
    compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
}
def validationJar = tasks.register('validationJar', Jar) {
    from sourceSets.validation.output
    archiveClassifier = 'validation'
    destinationDirectory = layout.buildDirectory.dir('validation')
}
if (hasProperty('tradeviewValidation')) {
    def validationRun = layout.buildDirectory.dir('run/validation')
    minecraft.runs.named('client') { workingDir = validationRun }
    def installValidation = tasks.register('installValidation', Copy) {
        from validationJar
        into validationRun.map { it.dir('mods') }
    }
    tasks.matching { it.name == 'runClient' }.configureEach { dependsOn installValidation }
}

tasks.named('jar', Jar) {
    dependsOn jarJarMetadata
    from(layout.buildDirectory.dir('nestedJars'))
    from(configurations.bundled) { into 'META-INF/jarjar' }
}

processResources {
    def props = [version: mod_version, minecraft_version: '1.21.1', forge_version: forge_version, java_version: '21']
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'tradeview-legacy.mixins.json']) { expand props }
    exclude 'tradeview.mixins.json'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.matching { it.name in ['jar', 'sourcesJar'] }.configureEach {
    manifest.attributes('MixinConfigs': 'tradeview-legacy.mixins.json')
    from("${repositoryRoot}/LICENSE") { rename { 'LICENSE_tradeview' } }
}
